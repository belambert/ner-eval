[project]
name = "ner-eval"
version = "0.1.0"
description = "Evaluate NER methods on Universal NER v2, OpenNER 1.0, and other recent benchmarks."
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
ner-eval = "ner_eval.cli:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
