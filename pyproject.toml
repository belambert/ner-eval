[project]
name = "ner-eval"
version = "0.1.0"
description = "Train and compare NER methods on English NER datasets."
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "protobuf>=7.36.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
    "typer>=0.27.3",
]

[project.scripts]
ner-eval = "ner_eval.cli:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "types-tqdm>=4.70.0.20260906",
]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
